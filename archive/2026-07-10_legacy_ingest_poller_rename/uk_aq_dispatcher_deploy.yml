name: Deploy uk_aq_dispatcher Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/uk_aq_dispatcher/**"
      - ".github/workflows/uk_aq_dispatcher_deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker (base)
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/uk_aq_dispatcher
          command: deploy

      - name: Set Worker secrets
        working-directory: workers/uk_aq_dispatcher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secrets_json="$(jq -n \
            --arg SUPABASE_URL "${{ vars.SUPABASE_URL }}" \
            --arg SB_PUBLISHABLE_DEFAULT_KEY "${{ secrets.SB_PUBLISHABLE_DEFAULT_KEY }}" \
            --arg SB_UK_AQ_CRON_SECRET "${{ secrets.SB_UK_AQ_CRON_SECRET }}" \
            '{SUPABASE_URL: $SUPABASE_URL, SB_PUBLISHABLE_DEFAULT_KEY: $SB_PUBLISHABLE_DEFAULT_KEY, SB_UK_AQ_CRON_SECRET: $SB_UK_AQ_CRON_SECRET}')"
          for attempt in 1 2 3; do
            if printf "%s" "$secrets_json" | npx wrangler secret bulk; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to apply Worker secrets after 3 attempts."
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/uk_aq_dispatcher
          command: deploy
