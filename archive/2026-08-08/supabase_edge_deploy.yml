name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/uk_aq_polling_cron.sql"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51
        with:
          version: latest

      - name: Inject project ref into web page
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SB_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.SB_PUBLISHABLE_DEFAULT_KEY }}
        run: |
          node scripts/uk_aq_inject_project_ref.mjs
      - name: Set Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SECRETS_ENV: ${{ secrets.SUPABASE_SECRETS_ENV }}
        run: |
          if [ -z "${SUPABASE_SECRETS_ENV:-}" ]; then
            echo "Missing SUPABASE_SECRETS_ENV secret." >&2
            exit 1
          fi
          printf '%s' "${SUPABASE_SECRETS_ENV}" > .env.supabase
          supabase secrets set             --env-file .env.supabase             --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"



      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          deploy_function() {
            local function_name="$1"
            shift

            local max_attempts=4
            local base_delay_seconds=20
            local attempt=1

            while true; do
              echo "Deploying ${function_name} (attempt ${attempt}/${max_attempts})..."
              if supabase functions deploy "${function_name}" "$@" --project-ref "${SUPABASE_PROJECT_REF}"; then
                echo "Deploy succeeded: ${function_name}"
                return 0
              fi

              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Deploy failed after ${max_attempts} attempts: ${function_name}" >&2
                return 1
              fi

              local sleep_seconds=$((base_delay_seconds * attempt))
              echo "Deploy failed: ${function_name}; retrying in ${sleep_seconds}s..." >&2
              sleep "${sleep_seconds}"
              attempt=$((attempt + 1))
            done
          }

          deploy_function ingest_sos
          deploy_function ingest_breathelondon
          deploy_function uk_aq_latest --no-verify-jwt
          deploy_function uk_aq_stations_chart --no-verify-jwt
          deploy_function uk_aq_la_hex --no-verify-jwt
          deploy_function uk_aq_pcon_hex --no-verify-jwt
          deploy_function uk_aq_stations --no-verify-jwt
          deploy_function uk_aq_public_networks --no-verify-jwt
          deploy_function uk_aq_timeseries --no-verify-jwt
          deploy_function uk_aq_station_snapshot
          deploy_function uk_aq_egress_monitor
