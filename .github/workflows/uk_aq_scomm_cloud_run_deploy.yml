# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Sensor.Community Cloud Run Service

on:
  push:
    branches:
      - main
    paths:
      - "workers/uk_aq_sensorcommunity_cloud_run/**"
      - "supabase/functions/_shared/ingestdb_observation_writer.mjs"
      - "scripts/gcp/**"
      - "scripts/cloudflare/uk_aq_reconcile_ingest_scheduler_url.sh"
      - ".github/workflows/uk_aq_scomm_cloud_run_deploy.yml"
  workflow_dispatch:

concurrency:
  group: uk-aq-ingest-cloud-run-shared-secret-deploy
  cancel-in-progress: false

jobs:
  deploy-scomm-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO || 'uk-aq' }}
      SERVICE_NAME: ${{ vars.GCP_SCOMM_JOB_NAME || 'uk-aq-scomm-ingest' }}
      SCOMM_SERVICE_ACCOUNT: ${{ vars.GCP_SCOMM_JOB_SERVICE_ACCOUNT || '' }}
      RESOURCE_LABEL: uk-aq-scomm-ingest-service
      SERVICE_TIMEOUT_SECONDS: '600'
      SERVICE_CPU: '0.1'
      SERVICE_MEMORY: 256Mi
      SERVICE_CONCURRENCY: '1'
      SERVICE_MAX_INSTANCES: '1'
      SERVICE_MIN_INSTANCES: '0'
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      OBS_AQIDB_SUPABASE_URL: ${{ vars.OBS_AQIDB_SUPABASE_URL }}
      UK_AQ_CORE_SCHEMA: ${{ vars.UK_AQ_CORE_SCHEMA || 'uk_aq_core' }}
      UK_AQ_RAW_SCHEMA: ${{ vars.UK_AQ_RAW_SCHEMA || 'uk_aq_raw' }}
      OBS_AQIDB_RPC_SCHEMA: ${{ vars.OBS_AQIDB_RPC_SCHEMA || 'uk_aq_public' }}
      UK_AQ_SERVICE_EGRESS_METRICS_ENABLED: ${{ vars.UK_AQ_SERVICE_EGRESS_METRICS_ENABLED || 'false' }}
      UK_AQ_SERVICE_EGRESS_METRICS_SUPABASE_URL: ${{ vars.UK_AQ_SERVICE_EGRESS_METRICS_SUPABASE_URL || vars.OBS_AQIDB_SUPABASE_URL || '' }}
      UK_AQ_SERVICE_EGRESS_METRICS_SCHEMA: ${{ vars.UK_AQ_SERVICE_EGRESS_METRICS_SCHEMA || 'uk_aq_public' }}
      UK_AQ_SERVICE_EGRESS_METRICS_RPC: ${{ vars.UK_AQ_SERVICE_EGRESS_METRICS_RPC || 'uk_aq_rpc_service_egress_metrics_batch_upsert' }}
      UK_AQ_SERVICE_EGRESS_ENV: ${{ vars.UK_AQ_SERVICE_EGRESS_ENV || vars.UK_AQ_ENV || 'TEST' }}
      OBSERVS_WRITE_MODE: ${{ vars.SCOMM_OBSERVS_WRITE_MODE || 'pubsub_only' }}
      GCP_OBSERVS_PUBSUB_TOPIC: ${{ vars.GCP_OBSERVS_PUBSUB_TOPIC || 'uk-aq-observs-observations' }}
      OBSERVS_PUBSUB_PUBLISH_BATCH_SIZE: ${{ vars.OBSERVS_PUBSUB_PUBLISH_BATCH_SIZE || '500' }}
      SCOMM_COUNTRY: ${{ vars.SCOMM_COUNTRY || 'GB' }}
      SCOMM_BASE_URL: ${{ vars.SCOMM_BASE_URL || 'https://data.sensor.community' }}
      SCOMM_SERVICE_REF: ${{ vars.SCOMM_SERVICE_REF || 'sensorcommunity' }}
      SCOMM_USER_AGENT: ${{ vars.SCOMM_USER_AGENT || 'uk-air-quality-networks' }}
      SCOMM_INGEST_MET_FIELDS: ${{ vars.SCOMM_INGEST_MET_FIELDS || 'true' }}
      SCOMM_RAW_DROPBOX_ALLOWED_SUPABASE_URL: ${{ vars.SCOMM_RAW_DROPBOX_ALLOWED_SUPABASE_URL || '' }}
      UK_AIR_RAW_DROPBOX_ALLOWED_SUPABASE_URL: ${{ vars.UK_AIR_RAW_DROPBOX_ALLOWED_SUPABASE_URL || '' }}
      UK_AQ_DROPBOX_ROOT: ${{ vars.UK_AQ_DROPBOX_ROOT }}
      SCOMM_RAW_DROPBOX_FOLDER: ${{ vars.SCOMM_RAW_DROPBOX_FOLDER || '/connectors/sensorcommunity/raw_data' }}
      UK_AIR_RAW_DROPBOX_FOLDER: ${{ vars.UK_AIR_RAW_DROPBOX_FOLDER || '/connectors/sensorcommunity/raw_data' }}
      SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
      OBS_AQIDB_SECRET_KEY: ${{ secrets.OBS_AQIDB_SECRET_KEY }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      SB_SECRET_KEY_SECRET_NAME: ${{ vars.SB_SECRET_KEY_SECRET_NAME || 'SB_SECRET_KEY' }}
      OBS_AQIDB_SECRET_KEY_SECRET_NAME: ${{ vars.OBS_AQIDB_SECRET_KEY_SECRET_NAME || 'OBS_AQIDB_SECRET_KEY' }}
      UK_AQ_SERVICE_EGRESS_METRICS_SB_SECRET_KEY_SECRET_NAME: ${{ vars.UK_AQ_SERVICE_EGRESS_METRICS_SB_SECRET_KEY_SECRET_NAME || vars.OBS_AQIDB_SECRET_KEY_SECRET_NAME || 'OBS_AQIDB_SECRET_KEY' }}
      DROPBOX_APP_KEY_SECRET_NAME: ${{ vars.DROPBOX_APP_KEY_SECRET_NAME || 'DROPBOX_APP_KEY' }}
      DROPBOX_APP_SECRET_SECRET_NAME: ${{ vars.DROPBOX_APP_SECRET_SECRET_NAME || 'DROPBOX_APP_SECRET' }}
      DROPBOX_REFRESH_TOKEN_SECRET_NAME: ${{ vars.DROPBOX_REFRESH_TOKEN_SECRET_NAME || 'DROPBOX_REFRESH_TOKEN' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      UK_AQ_EDGE_UPSTREAM_SECRET: ${{ secrets.UK_AQ_EDGE_UPSTREAM_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCHEDULER_D1_JOB_KEY: uk_aq_scomm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project config
        run: |
          if [ -z "${PROJECT_ID:-}" ]; then
            echo "Missing required secret: GCP_PROJECT_ID"
            exit 1
          fi
          if [ -z "${SCOMM_SERVICE_ACCOUNT:-}" ]; then
            echo "Missing required service account setting."
            echo "Set repo variable: GCP_SCOMM_JOB_SERVICE_ACCOUNT"
            exit 1
          fi
          if [[ "${SCOMM_SERVICE_ACCOUNT}" == *"-compute@developer.gserviceaccount.com" ]]; then
            echo "Invalid GCP_SCOMM_JOB_SERVICE_ACCOUNT: default compute service account is not allowed."
            exit 1
          fi
          observs_mode="$(printf '%s' "${OBSERVS_WRITE_MODE:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "${observs_mode}" = "pubsub_only" ]; then
            if [ -z "${GCP_OBSERVS_PUBSUB_TOPIC:-}" ]; then
              echo "OBSERVS_WRITE_MODE=pubsub_only requires GCP_OBSERVS_PUBSUB_TOPIC."
              exit 1
            fi
          elif [ "${observs_mode}" = "direct" ]; then
            if [ -z "${OBS_AQIDB_SUPABASE_URL:-}" ]; then
              echo "OBSERVS_WRITE_MODE=direct requires OBS_AQIDB_SUPABASE_URL."
              exit 1
            fi
            if [ -z "${OBS_AQIDB_SECRET_KEY:-}" ]; then
              echo "OBSERVS_WRITE_MODE=direct requires OBS_AQIDB_SECRET_KEY."
              exit 1
            fi
          fi
          metrics_enabled="$(printf '%s' "${UK_AQ_SERVICE_EGRESS_METRICS_ENABLED:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "${metrics_enabled}" = "true" ] || [ "${metrics_enabled}" = "1" ] || [ "${metrics_enabled}" = "yes" ] || [ "${metrics_enabled}" = "on" ]; then
            if [ -z "${UK_AQ_SERVICE_EGRESS_METRICS_SUPABASE_URL:-}" ]; then
              echo "UK_AQ_SERVICE_EGRESS_METRICS_ENABLED requires a metrics Supabase URL."
              exit 1
            fi
            if [ -z "${OBS_AQIDB_SECRET_KEY:-}" ]; then
              echo "UK_AQ_SERVICE_EGRESS_METRICS_ENABLED requires OBS_AQIDB_SECRET_KEY."
              exit 1
            fi
          fi

      - name: Validate Google auth config
        run: |
          if [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ] && [ -n "${GCP_SERVICE_ACCOUNT:-}" ]; then
            echo "Using Workload Identity Federation auth."
          elif [ -n "${GCP_SA_KEY:-}" ]; then
            echo "Using Service Account key auth."
          else
            echo "Missing Google auth config."
            echo "Set either:"
            echo "1) GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT"
            echo "or"
            echo "2) GCP_SA_KEY"
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key fallback)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Configure gcloud project
        run: |
          gcloud config set project "${PROJECT_ID}"
          gcloud config set run/region "${REGION}"

      - name: Verify Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${REPO}" \
            --location "${REGION}" \
            --project "${PROJECT_ID}" >/dev/null

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push Sensor.Community image
        id: build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/uk-aq-scomm:${GITHUB_SHA::12}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          docker build -f workers/uk_aq_sensorcommunity_cloud_run/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Ensure observs Pub/Sub topic + publisher IAM binding
        run: |
          set -euo pipefail
          observs_mode="$(printf '%s' "${OBSERVS_WRITE_MODE:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "${observs_mode}" != "pubsub_only" ]; then
            echo "Skipping Pub/Sub publisher setup (OBSERVS_WRITE_MODE=${OBSERVS_WRITE_MODE})."
            exit 0
          fi

          if gcloud pubsub topics describe "${GCP_OBSERVS_PUBSUB_TOPIC}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
            echo "Pub/Sub topic exists: ${GCP_OBSERVS_PUBSUB_TOPIC}"
          else
            gcloud pubsub topics create "${GCP_OBSERVS_PUBSUB_TOPIC}" --project "${PROJECT_ID}"
            echo "Created Pub/Sub topic: ${GCP_OBSERVS_PUBSUB_TOPIC}"
          fi

          gcloud pubsub topics add-iam-policy-binding "${GCP_OBSERVS_PUBSUB_TOPIC}" \
            --project "${PROJECT_ID}" \
            --member "serviceAccount:${SCOMM_SERVICE_ACCOUNT}" \
            --role "roles/pubsub.publisher" >/dev/null

      - name: Sync GitHub secrets to GCP Secret Manager
        run: |
          set -euo pipefail
          UPSERT_SCRIPT="scripts/gcp/uk_aq_secret_upsert_if_changed.sh"

          upsert_secret() {
            local secret_name="$1"
            local secret_value="$2"
            local required="${3:-0}"

            if [ -z "${secret_name}" ]; then
              if [ "${required}" = "1" ]; then
                echo "Missing required secret name."
                exit 1
              fi
              return 0
            fi

            if [ -z "${secret_value}" ] && [ "${required}" = "0" ]; then
              echo "Skipping optional secret ${secret_name} (no GitHub secret/variable value)."
              return 0
            fi

            printf '%s' "${secret_value}" | "${UPSERT_SCRIPT}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --secret "${secret_name}" \
              --required "${required}" \
              --apply
          }

          upsert_secret "${SB_SECRET_KEY_SECRET_NAME}" "${SB_SECRET_KEY}" 1
          upsert_secret "UK_AQ_EDGE_UPSTREAM_SECRET" "${UK_AQ_EDGE_UPSTREAM_SECRET}" 1
          observs_mode="$(printf '%s' "${OBSERVS_WRITE_MODE:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "${observs_mode}" = "direct" ]; then
            upsert_secret "${OBS_AQIDB_SECRET_KEY_SECRET_NAME}" "${OBS_AQIDB_SECRET_KEY}" 1
          else
            echo "Skipping OBS_AQIDB_SECRET_KEY secret sync (OBSERVS_WRITE_MODE=${OBSERVS_WRITE_MODE})."
          fi
          metrics_enabled="$(printf '%s' "${UK_AQ_SERVICE_EGRESS_METRICS_ENABLED:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "${metrics_enabled}" = "true" ] || [ "${metrics_enabled}" = "1" ] || [ "${metrics_enabled}" = "yes" ] || [ "${metrics_enabled}" = "on" ]; then
            upsert_secret "${UK_AQ_SERVICE_EGRESS_METRICS_SB_SECRET_KEY_SECRET_NAME}" "${OBS_AQIDB_SECRET_KEY}" 1
          else
            echo "Skipping service-egress metrics secret sync (metrics disabled)."
          fi
          upsert_secret "${DROPBOX_APP_KEY_SECRET_NAME}" "${DROPBOX_APP_KEY}" 0
          upsert_secret "${DROPBOX_APP_SECRET_SECRET_NAME}" "${DROPBOX_APP_SECRET}" 0
          upsert_secret "${DROPBOX_REFRESH_TOKEN_SECRET_NAME}" "${DROPBOX_REFRESH_TOKEN}" 0

      - name: Build Cloud Run env and secret args
        id: cloudrun_args
        run: |
          set -euo pipefail

          require_env() {
            local key="$1"
            local value="${!key:-}"
            if [ -z "${value}" ]; then
              echo "Missing required value for ${key}"
              exit 1
            fi
          }

          add_env() {
            local key="$1"
            local value="${!key:-}"
            if [ -n "${value}" ]; then
              env_updates+=("${key}=${value}")
            fi
          }

          add_secret_binding() {
            local env_key="$1"
            local secret_name="$2"
            local required="${3:-0}"
            if [ -z "${secret_name}" ]; then
              if [ "${required}" = "1" ]; then
                echo "Missing secret name for required binding ${env_key}"
                exit 1
              fi
              return 0
            fi
            if gcloud secrets describe "${secret_name}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
              secret_updates+=("${env_key}=${secret_name}:latest")
              return 0
            fi
            if [ "${required}" = "1" ]; then
              echo "Required Secret Manager secret not found: ${secret_name}"
              exit 1
            fi
            echo "Optional Secret Manager secret not found, skipping: ${secret_name}"
          }

          require_env SUPABASE_URL

          env_updates=()
          add_env SUPABASE_URL
          add_env OBSERVS_WRITE_MODE
          add_env GCP_OBSERVS_PUBSUB_TOPIC
          add_env OBSERVS_PUBSUB_PUBLISH_BATCH_SIZE
          add_env UK_AQ_CORE_SCHEMA
          add_env UK_AQ_RAW_SCHEMA
          add_env UK_AQ_SERVICE_EGRESS_METRICS_ENABLED
          add_env UK_AQ_SERVICE_EGRESS_METRICS_SUPABASE_URL
          add_env UK_AQ_SERVICE_EGRESS_METRICS_SCHEMA
          add_env UK_AQ_SERVICE_EGRESS_METRICS_RPC
          add_env UK_AQ_SERVICE_EGRESS_ENV
          add_env SCOMM_COUNTRY
          add_env SCOMM_BASE_URL
          add_env SCOMM_SERVICE_REF
          add_env SCOMM_USER_AGENT
          add_env SCOMM_INGEST_MET_FIELDS
          add_env SCOMM_RAW_DROPBOX_ALLOWED_SUPABASE_URL
          add_env UK_AIR_RAW_DROPBOX_ALLOWED_SUPABASE_URL
          add_env UK_AQ_DROPBOX_ROOT
          add_env SCOMM_RAW_DROPBOX_FOLDER
          add_env UK_AIR_RAW_DROPBOX_FOLDER
          env_updates+=("GCP_PROJECT_ID=${PROJECT_ID}")
          if [ -n "${OBS_AQIDB_SUPABASE_URL:-}" ]; then
            add_env OBS_AQIDB_SUPABASE_URL
            add_env OBS_AQIDB_RPC_SCHEMA
          fi

          observs_mode="$(printf '%s' "${OBSERVS_WRITE_MODE:-}" | tr '[:upper:]' '[:lower:]')"
          secret_updates=()
          add_secret_binding "UK_AQ_EDGE_UPSTREAM_SECRET" "UK_AQ_EDGE_UPSTREAM_SECRET" 1
          add_secret_binding "SB_SECRET_KEY" "${SB_SECRET_KEY_SECRET_NAME}" 1
          if [ "${observs_mode}" = "direct" ]; then
            add_secret_binding "OBS_AQIDB_SECRET_KEY" "${OBS_AQIDB_SECRET_KEY_SECRET_NAME}" 1
          else
            echo "Skipping OBS_AQIDB_SECRET_KEY secret binding (OBSERVS_WRITE_MODE=${OBSERVS_WRITE_MODE})."
          fi
          metrics_enabled="$(printf '%s' "${UK_AQ_SERVICE_EGRESS_METRICS_ENABLED:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "${metrics_enabled}" = "true" ] || [ "${metrics_enabled}" = "1" ] || [ "${metrics_enabled}" = "yes" ] || [ "${metrics_enabled}" = "on" ]; then
            add_secret_binding "UK_AQ_SERVICE_EGRESS_METRICS_SB_SECRET_KEY" "${UK_AQ_SERVICE_EGRESS_METRICS_SB_SECRET_KEY_SECRET_NAME}" 1
          else
            echo "Skipping service-egress metrics secret binding (metrics disabled)."
          fi
          if [ -n "${DROPBOX_APP_KEY:-}" ] && [ -n "${DROPBOX_APP_SECRET:-}" ] && [ -n "${DROPBOX_REFRESH_TOKEN:-}" ]; then
            add_secret_binding "DROPBOX_APP_KEY" "${DROPBOX_APP_KEY_SECRET_NAME}" 0
            add_secret_binding "DROPBOX_APP_SECRET" "${DROPBOX_APP_SECRET_SECRET_NAME}" 0
            add_secret_binding "DROPBOX_REFRESH_TOKEN" "${DROPBOX_REFRESH_TOKEN_SECRET_NAME}" 0
          fi

          env_file="${RUNNER_TEMP}/uk-aq-scomm-env.yaml"
          : > "${env_file}"
          for kv in "${env_updates[@]}"; do
            key="${kv%%=*}"
            value="${kv#*=}"
            python3 -c 'import json,sys; f=open(sys.argv[1], "a", encoding="utf-8"); print(f"{sys.argv[2]}: {json.dumps(sys.argv[3])}", file=f); f.close()' \
              "${env_file}" "${key}" "${value}"
          done

          secret_csv="$(IFS=,; echo "${secret_updates[*]}")"
          echo "env_file=${env_file}" >> "${GITHUB_OUTPUT}"
          echo "secret_csv=${secret_csv}" >> "${GITHUB_OUTPUT}"

      - name: Deploy Cloud Run service
        run: |
          set -euo pipefail
          ENV_FILE='${{ steps.cloudrun_args.outputs.env_file }}'
          SECRET_CSV='${{ steps.cloudrun_args.outputs.secret_csv }}'

          CMD=(
            gcloud run deploy "${SERVICE_NAME}"
            --region "${REGION}"
            --image "${{ steps.build.outputs.image }}"
            --service-account "${SCOMM_SERVICE_ACCOUNT}"
            --timeout "${SERVICE_TIMEOUT_SECONDS}"
            --cpu "${SERVICE_CPU}"
            --memory "${SERVICE_MEMORY}"
            --concurrency "${SERVICE_CONCURRENCY}"
            --max-instances "${SERVICE_MAX_INSTANCES}"
            --min-instances "${SERVICE_MIN_INSTANCES}"
            --no-cpu-boost
            --cpu-throttling
            --labels "job_name=${RESOURCE_LABEL}"
            --allow-unauthenticated
          )
          if [ -n "${ENV_FILE}" ]; then
            CMD+=(--env-vars-file "${ENV_FILE}")
          fi
          if [ -n "${SECRET_CSV}" ]; then
            CMD+=(--set-secrets "${SECRET_CSV}")
          fi
          "${CMD[@]}"

      - name: Verify service labels
        run: |
          set -euo pipefail
          labels_json="$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --format="json(metadata.labels)")"
          job_name_label="$(
            python3 -c 'import json,sys; print(((json.loads(sys.stdin.read()) or {}).get("metadata", {}) or {}).get("labels", {}).get("job_name", ""))' <<<"${labels_json}"
          )"
          if [ "${job_name_label}" != "${RESOURCE_LABEL}" ]; then
            echo "job_name label mismatch: expected ${RESOURCE_LABEL}, got ${job_name_label:-<missing>}"
            exit 1
          fi
          echo "Verified label job_name=${job_name_label}"

      - name: Reconcile Cloud Run URL in ingest scheduler D1
        run: |
          service_uri="$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --format='value(status.url)')"
          scripts/cloudflare/uk_aq_reconcile_ingest_scheduler_url.sh "${SCHEDULER_D1_JOB_KEY}" "${service_uri}"

      - name: Show deployed service
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format="yaml(metadata.name,metadata.labels,spec.template.spec.serviceAccountName,spec.template.spec.containerConcurrency,spec.template.spec.containers[0].image,spec.template.spec.containers[0].resources,status.url)"
