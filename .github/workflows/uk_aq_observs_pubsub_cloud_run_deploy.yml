name: Deploy Observs Pub/Sub Cloud Run Service

on:
  push:
    branches:
      - main
    paths:
      - "workers/uk_aq_observs_pubsub_cloud_run/**"
      - "supabase/functions/_shared/fetch_egress_patch.ts"
      - "supabase/functions/_shared/egress_metrics.ts"
      - "supabase/functions/_shared/observs_client.ts"
      - "scripts/gcp/**"
      - ".github/workflows/uk_aq_observs_pubsub_cloud_run_deploy.yml"
  workflow_dispatch:

jobs:
  deploy-observs-pubsub-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO || 'uk-aq' }}
      SERVICE_NAME: ${{ vars.GCP_OBSERVS_PUBSUB_SERVICE_NAME || vars.GCP_OBSERVS_PUBSUB_JOB_NAME || 'uk-aq-observs-pubsub-writer' }}
      OBSERVS_PUBSUB_SERVICE_ACCOUNT: ${{ vars.GCP_OBSERVS_PUBSUB_SERVICE_ACCOUNT || vars.GCP_OBSERVS_PUBSUB_JOB_SERVICE_ACCOUNT || '' }}
      RESOURCE_LABEL: uk-aq-observs-pubsub-writer-service
      SERVICE_TIMEOUT_SECONDS: ${{ vars.GCP_OBSERVS_PUBSUB_SERVICE_TIMEOUT_SECONDS || vars.GCP_OBSERVS_PUBSUB_JOB_TIMEOUT_SECONDS || '1500' }}
      SERVICE_CPU: ${{ vars.GCP_OBSERVS_PUBSUB_SERVICE_CPU || '0.25' }}
      SERVICE_MEMORY: ${{ vars.GCP_OBSERVS_PUBSUB_SERVICE_MEMORY || '256Mi' }}
      SERVICE_CONCURRENCY: ${{ vars.GCP_OBSERVS_PUBSUB_SERVICE_CONCURRENCY || '1' }}
      SERVICE_MAX_INSTANCES: ${{ vars.GCP_OBSERVS_PUBSUB_SERVICE_MAX_INSTANCES || '1' }}
      SERVICE_MIN_INSTANCES: ${{ vars.GCP_OBSERVS_PUBSUB_SERVICE_MIN_INSTANCES || '0' }}
      SCHEDULER_ENABLED: ${{ vars.GCP_OBSERVS_PUBSUB_SCHEDULER_ENABLED || 'true' }}
      SCHEDULER_JOB_NAME: ${{ vars.GCP_OBSERVS_PUBSUB_SCHEDULER_JOB_NAME || 'uk-aq-observs-pubsub-hourly' }}
      SCHEDULER_CRON: ${{ vars.GCP_OBSERVS_PUBSUB_SCHEDULER_CRON || '0 * * * *' }}
      SCHEDULER_TIMEZONE: ${{ vars.GCP_OBSERVS_PUBSUB_SCHEDULER_TIMEZONE || 'Etc/UTC' }}
      SCHEDULER_MAX_RETRY_ATTEMPTS: ${{ vars.GCP_OBSERVS_PUBSUB_SCHEDULER_MAX_RETRY_ATTEMPTS || '0' }}
      SCHEDULER_SERVICE_ACCOUNT: ${{ vars.GCP_OBSERVS_PUBSUB_SCHEDULER_SERVICE_ACCOUNT || '' }}
      PUBSUB_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PUBSUB_TOPIC: ${{ vars.GCP_OBSERVS_PUBSUB_TOPIC || 'uk-aq-observs-observations' }}
      PUBSUB_SUBSCRIPTION: ${{ vars.OBSERVS_PUBSUB_SUBSCRIPTION || 'uk-aq-observs-observations-sub' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      OBS_AQIDB_SUPABASE_URL: ${{ vars.OBS_AQIDB_SUPABASE_URL }}
      UK_AQ_PUBLIC_SCHEMA: ${{ vars.UK_AQ_PUBLIC_SCHEMA || 'uk_aq_public' }}
      OBS_AQIDB_RPC_SCHEMA: ${{ vars.OBS_AQIDB_RPC_SCHEMA || 'uk_aq_public' }}
      OBSERVS_UPSERT_RPC: ${{ vars.OBSERVS_UPSERT_RPC || 'uk_aq_rpc_observs_observations_compact_upsert_v1' }}
      OBSERVS_UPSERT_CHUNK_SIZE: ${{ vars.OBSERVS_UPSERT_CHUNK_SIZE || '5000' }}
      OBSERVS_UPSERT_RPC_RETRIES: ${{ vars.OBSERVS_UPSERT_RPC_RETRIES || '3' }}
      OBSERVS_UPSERT_RETRY_BASE_MS: ${{ vars.OBSERVS_UPSERT_RETRY_BASE_MS || '1000' }}
      OBSERVS_UPSERT_TIMEOUT_SPLIT_MIN_ROWS: ${{ vars.OBSERVS_UPSERT_TIMEOUT_SPLIT_MIN_ROWS || '32' }}
      OBSERVS_UPSERT_TIMEOUT_SPLIT_MAX_DEPTH: ${{ vars.OBSERVS_UPSERT_TIMEOUT_SPLIT_MAX_DEPTH || '4' }}
      OBSERVS_PUBSUB_PULL_MAX_MESSAGES: ${{ vars.OBSERVS_PUBSUB_PULL_MAX_MESSAGES || '1000' }}
      OBSERVS_PUBSUB_WRITER_MAX_BATCHES: ${{ vars.OBSERVS_PUBSUB_WRITER_MAX_BATCHES || '24' }}
      OBSERVS_PUBSUB_WRITER_BUDGET_SECONDS: ${{ vars.OBSERVS_PUBSUB_WRITER_BUDGET_SECONDS || '1200' }}
      OBSERVS_PUBSUB_WRITER_SHUTDOWN_BUFFER_SECONDS: ${{ vars.OBSERVS_PUBSUB_WRITER_SHUTDOWN_BUFFER_SECONDS || '20' }}
      OBSERVS_PUBSUB_WRITER_RPC_RETRIES: ${{ vars.OBSERVS_PUBSUB_WRITER_RPC_RETRIES || '3' }}
      OBSERVS_PUBSUB_WRITER_PUBSUB_RETRIES: ${{ vars.OBSERVS_PUBSUB_WRITER_PUBSUB_RETRIES || '3' }}
      SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
      OBS_AQIDB_SECRET_KEY: ${{ secrets.OBS_AQIDB_SECRET_KEY }}
      SB_SECRET_KEY_SECRET_NAME: ${{ vars.SB_SECRET_KEY_SECRET_NAME || 'SB_SECRET_KEY' }}
      OBS_AQIDB_SECRET_KEY_SECRET_NAME: ${{ vars.OBS_AQIDB_SECRET_KEY_SECRET_NAME || 'OBS_AQIDB_SECRET_KEY' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project config
        run: |
          if [ -z "${PROJECT_ID:-}" ]; then
            echo "Missing required secret: GCP_PROJECT_ID"
            exit 1
          fi
          if [ -z "${OBSERVS_PUBSUB_SERVICE_ACCOUNT:-}" ]; then
            echo "Missing required service account setting."
            echo "Set repo variable: GCP_OBSERVS_PUBSUB_SERVICE_ACCOUNT (or legacy GCP_OBSERVS_PUBSUB_JOB_SERVICE_ACCOUNT)"
            exit 1
          fi
          if [[ "${OBSERVS_PUBSUB_SERVICE_ACCOUNT}" == *"-compute@developer.gserviceaccount.com" ]]; then
            echo "Invalid observs Pub/Sub runtime service account: default compute service account is not allowed."
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing required secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "${OBS_AQIDB_SUPABASE_URL:-}" ]; then
            echo "Missing required secret: OBS_AQIDB_SUPABASE_URL"
            exit 1
          fi
          if [ -z "${PUBSUB_PROJECT_ID:-}" ] || [ -z "${PUBSUB_TOPIC:-}" ] || [ -z "${PUBSUB_SUBSCRIPTION:-}" ]; then
            echo "Missing Pub/Sub configuration. Require PUBSUB_PROJECT_ID, PUBSUB_TOPIC, PUBSUB_SUBSCRIPTION."
            exit 1
          fi

      - name: Validate Google auth config
        run: |
          if [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ] && [ -n "${GCP_SERVICE_ACCOUNT:-}" ]; then
            echo "Using Workload Identity Federation auth."
          elif [ -n "${GCP_SA_KEY:-}" ]; then
            echo "Using Service Account key auth."
          else
            echo "Missing Google auth config."
            echo "Set either:"
            echo "1) GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT"
            echo "or"
            echo "2) GCP_SA_KEY"
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (Service Account Key fallback)
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Configure gcloud project
        run: |
          gcloud config set project "${PROJECT_ID}"
          gcloud config set run/region "${REGION}"

      - name: Verify Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${REPO}" \
            --location "${REGION}" \
            --project "${PROJECT_ID}" >/dev/null

      - name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push observs pubsub image
        id: build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/uk-aq-observs-pubsub:${GITHUB_SHA::12}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          docker build -f workers/uk_aq_observs_pubsub_cloud_run/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Ensure Pub/Sub topic/subscription + IAM bindings
        run: |
          set -euo pipefail

          if gcloud pubsub topics describe "${PUBSUB_TOPIC}" --project "${PUBSUB_PROJECT_ID}" >/dev/null 2>&1; then
            echo "Pub/Sub topic exists: ${PUBSUB_TOPIC}"
          else
            gcloud pubsub topics create "${PUBSUB_TOPIC}" --project "${PUBSUB_PROJECT_ID}"
            echo "Created Pub/Sub topic: ${PUBSUB_TOPIC}"
          fi

          if gcloud pubsub subscriptions describe "${PUBSUB_SUBSCRIPTION}" --project "${PUBSUB_PROJECT_ID}" >/dev/null 2>&1; then
            echo "Pub/Sub subscription exists: ${PUBSUB_SUBSCRIPTION}"
          else
            gcloud pubsub subscriptions create "${PUBSUB_SUBSCRIPTION}" \
              --project "${PUBSUB_PROJECT_ID}" \
              --topic "${PUBSUB_TOPIC}" \
              --ack-deadline "600"
            echo "Created Pub/Sub subscription: ${PUBSUB_SUBSCRIPTION}"
          fi

          gcloud pubsub subscriptions add-iam-policy-binding "${PUBSUB_SUBSCRIPTION}" \
            --project "${PUBSUB_PROJECT_ID}" \
            --member "serviceAccount:${OBSERVS_PUBSUB_SERVICE_ACCOUNT}" \
            --role "roles/pubsub.subscriber" >/dev/null

      - name: Sync GitHub secrets to GCP Secret Manager
        run: |
          set -euo pipefail
          UPSERT_SCRIPT="scripts/gcp/uk_aq_secret_upsert_if_changed.sh"

          upsert_secret() {
            local secret_name="$1"
            local secret_value="$2"
            local required="${3:-0}"

            if [ -z "${secret_name}" ]; then
              if [ "${required}" = "1" ]; then
                echo "Missing required secret name."
                exit 1
              fi
              return 0
            fi

            if [ -z "${secret_value}" ] && [ "${required}" = "0" ]; then
              echo "Skipping optional secret ${secret_name} (no GitHub secret/variable value)."
              return 0
            fi

            printf '%s' "${secret_value}" | "${UPSERT_SCRIPT}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --secret "${secret_name}" \
              --required "${required}" \
              --apply
          }

          upsert_secret "${SB_SECRET_KEY_SECRET_NAME}" "${SB_SECRET_KEY}" 1
          upsert_secret "${OBS_AQIDB_SECRET_KEY_SECRET_NAME}" "${OBS_AQIDB_SECRET_KEY}" 1

      - name: Build Cloud Run env and secret args
        id: cloudrun_args
        run: |
          set -euo pipefail

          require_env() {
            local key="$1"
            local value="${!key:-}"
            if [ -z "${value}" ]; then
              echo "Missing required value for ${key}"
              exit 1
            fi
          }

          add_env() {
            local key="$1"
            local value="${!key:-}"
            if [ -n "${value}" ]; then
              env_updates+=("${key}=${value}")
            fi
          }

          add_secret_binding() {
            local env_key="$1"
            local secret_name="$2"
            local required="${3:-0}"
            if [ -z "${secret_name}" ]; then
              if [ "${required}" = "1" ]; then
                echo "Missing secret name for required binding ${env_key}"
                exit 1
              fi
              return 0
            fi
            if gcloud secrets describe "${secret_name}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
              secret_updates+=("${env_key}=${secret_name}:latest")
              return 0
            fi
            if [ "${required}" = "1" ]; then
              echo "Required Secret Manager secret not found: ${secret_name}"
              exit 1
            fi
          }

          require_env SUPABASE_URL
          require_env OBS_AQIDB_SUPABASE_URL
          require_env PUBSUB_PROJECT_ID
          require_env PUBSUB_SUBSCRIPTION

          env_updates=()
          add_env SUPABASE_URL
          add_env OBS_AQIDB_SUPABASE_URL
          add_env UK_AQ_PUBLIC_SCHEMA
          add_env OBS_AQIDB_RPC_SCHEMA
          add_env OBSERVS_UPSERT_RPC
          add_env OBSERVS_UPSERT_CHUNK_SIZE
          add_env OBSERVS_UPSERT_RPC_RETRIES
          add_env OBSERVS_UPSERT_RETRY_BASE_MS
          add_env OBSERVS_UPSERT_TIMEOUT_SPLIT_MIN_ROWS
          add_env OBSERVS_UPSERT_TIMEOUT_SPLIT_MAX_DEPTH
          add_env OBSERVS_PUBSUB_PULL_MAX_MESSAGES
          add_env OBSERVS_PUBSUB_WRITER_MAX_BATCHES
          add_env OBSERVS_PUBSUB_WRITER_BUDGET_SECONDS
          add_env OBSERVS_PUBSUB_WRITER_SHUTDOWN_BUFFER_SECONDS
          add_env OBSERVS_PUBSUB_WRITER_RPC_RETRIES
          add_env OBSERVS_PUBSUB_WRITER_PUBSUB_RETRIES
          env_updates+=("OBSERVS_PUBSUB_LOCAL_PORT=8000")
          env_updates+=("GCP_PROJECT_ID=${PROJECT_ID}")
          env_updates+=("OBSERVS_PUBSUB_SUBSCRIPTION=${PUBSUB_SUBSCRIPTION}")

          secret_updates=()
          add_secret_binding "SB_SECRET_KEY" "${SB_SECRET_KEY_SECRET_NAME}" 1
          add_secret_binding "OBS_AQIDB_SECRET_KEY" "${OBS_AQIDB_SECRET_KEY_SECRET_NAME}" 1

          env_file="${RUNNER_TEMP}/uk-aq-observs-pubsub-env.yaml"
          : > "${env_file}"
          for kv in "${env_updates[@]}"; do
            key="${kv%%=*}"
            value="${kv#*=}"
            python3 -c 'import json,sys; f=open(sys.argv[1], "a", encoding="utf-8"); print(f"{sys.argv[2]}: {json.dumps(sys.argv[3])}", file=f); f.close()' \
              "${env_file}" "${key}" "${value}"
          done

          secret_csv="$(IFS=,; echo "${secret_updates[*]}")"
          echo "env_file=${env_file}" >> "${GITHUB_OUTPUT}"
          echo "secret_csv=${secret_csv}" >> "${GITHUB_OUTPUT}"

      - name: Deploy Cloud Run service
        run: |
          set -euo pipefail
          ENV_FILE='${{ steps.cloudrun_args.outputs.env_file }}'
          SECRET_CSV='${{ steps.cloudrun_args.outputs.secret_csv }}'

          CMD=(
            gcloud run deploy "${SERVICE_NAME}"
            --region "${REGION}"
            --image "${{ steps.build.outputs.image }}"
            --service-account "${OBSERVS_PUBSUB_SERVICE_ACCOUNT}"
            --timeout "${SERVICE_TIMEOUT_SECONDS}"
            --cpu "${SERVICE_CPU}"
            --memory "${SERVICE_MEMORY}"
            --concurrency "${SERVICE_CONCURRENCY}"
            --max-instances "${SERVICE_MAX_INSTANCES}"
            --min-instances "${SERVICE_MIN_INSTANCES}"
            --no-cpu-boost
            --cpu-throttling
            --labels "job_name=${RESOURCE_LABEL}"
            --no-allow-unauthenticated
          )
          if [ -n "${ENV_FILE}" ]; then
            CMD+=(--env-vars-file "${ENV_FILE}")
          fi
          if [ -n "${SECRET_CSV}" ]; then
            CMD+=(--set-secrets "${SECRET_CSV}")
          fi
          "${CMD[@]}"

      - name: Verify service labels
        run: |
          set -euo pipefail
          labels_json="$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --format="json(metadata.labels)")"
          job_name_label="$(
            python3 -c 'import json,sys; print(((json.loads(sys.stdin.read()) or {}).get("metadata", {}) or {}).get("labels", {}).get("job_name", ""))' <<<"${labels_json}"
          )"
          if [ "${job_name_label}" != "${RESOURCE_LABEL}" ]; then
            echo "job_name label mismatch: expected ${RESOURCE_LABEL}, got ${job_name_label:-<missing>}"
            exit 1
          fi
          echo "Verified label job_name=${job_name_label}"

      - name: Ensure Cloud Scheduler trigger exists
        run: |
          set -euo pipefail

          enabled="$(printf '%s' "${SCHEDULER_ENABLED}" | tr '[:upper:]' '[:lower:]')"
          if [ "${enabled}" != "true" ] && [ "${enabled}" != "1" ] && [ "${enabled}" != "yes" ]; then
            echo "Skipping scheduler trigger management (SCHEDULER_ENABLED=${SCHEDULER_ENABLED})."
            exit 0
          fi

          scheduler_sa="${SCHEDULER_SERVICE_ACCOUNT:-${OBSERVS_PUBSUB_SERVICE_ACCOUNT}}"
          service_uri="$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --format='value(status.url)')"
          scheduler_body='{"trigger_mode":"scheduler"}'
          scheduler_attempt_deadline="1200s"

          gcloud run services add-iam-policy-binding "${SERVICE_NAME}" \
            --region "${REGION}" \
            --member "serviceAccount:${scheduler_sa}" \
            --role "roles/run.invoker" >/dev/null

          if gcloud scheduler jobs describe "${SCHEDULER_JOB_NAME}" --location "${REGION}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "${SCHEDULER_JOB_NAME}" \
              --location "${REGION}" \
              --schedule "${SCHEDULER_CRON}" \
              --time-zone "${SCHEDULER_TIMEZONE}" \
              --uri "${service_uri}" \
              --http-method POST \
              --update-headers "Content-Type=application/json" \
              --message-body "${scheduler_body}" \
              --oidc-service-account-email "${scheduler_sa}" \
              --oidc-token-audience "${service_uri}" \
              --attempt-deadline "${scheduler_attempt_deadline}" \
              --max-retry-attempts "${SCHEDULER_MAX_RETRY_ATTEMPTS}"
            echo "Updated Cloud Scheduler job: ${SCHEDULER_JOB_NAME}"
          else
            gcloud scheduler jobs create http "${SCHEDULER_JOB_NAME}" \
              --location "${REGION}" \
              --schedule "${SCHEDULER_CRON}" \
              --time-zone "${SCHEDULER_TIMEZONE}" \
              --uri "${service_uri}" \
              --http-method POST \
              --headers "Content-Type=application/json" \
              --message-body "${scheduler_body}" \
              --oidc-service-account-email "${scheduler_sa}" \
              --oidc-token-audience "${service_uri}" \
              --attempt-deadline "${scheduler_attempt_deadline}" \
              --max-retry-attempts "${SCHEDULER_MAX_RETRY_ATTEMPTS}"
            echo "Created Cloud Scheduler job: ${SCHEDULER_JOB_NAME}"
          fi

      - name: Show deployed service
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format="yaml(metadata.name,metadata.labels,spec.template.spec.serviceAccountName,spec.template.spec.containerConcurrency,spec.template.spec.containers[0].image,spec.template.spec.containers[0].resources,status.url)"
