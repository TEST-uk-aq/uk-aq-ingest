name: UK-AQ Stations Daily Sync

permissions:
  contents: write

on:
  # Intended external schedule:
  #   03:00 UTC daily via Cloudflare Worker
  # Previous GitHub cron:
  #   schedule:
  #     - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: uk-aq-stations-daily
  cancel-in-progress: false

jobs:
  sync-stations:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOS_CONNECTOR_CODE: sos
      SCOMM_CONNECTOR_CODE: sensorcommunity
      OPENAQ_POLL_WAS_ENABLED: "0"
      SOS_POLL_WAS_ENABLED: "0"
      RUN_SCOMM_STATIONS_EXPORT: "0"
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      UK_AQ_DROPBOX_ROOT: ${{ vars.UK_AQ_DROPBOX_ROOT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for daily task health reporting
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Report daily task health (started)
        id: daily_task_health_started
        env:
          SUPABASE_URL: ${{ vars.OBS_AQIDB_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OBS_AQIDB_SECRET_KEY }}
          DAILY_TASK_KEY: ingest.stations_daily
          DAILY_TASK_HEALTH_REPORT_STAGE: started
        run: node scripts/report_daily_task_health.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests python-dotenv supabase pyproj psycopg2-binary pandas pyreadr

      - name: Validate SUPABASE_DB_URL for pooler
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          dsn = (os.environ.get("SUPABASE_DB_URL") or "").strip()
          if not dsn:
              raise SystemExit("Missing SUPABASE_DB_URL (or DATABASE_URL) secret.")

          parsed = urlparse(dsn)
          host = (parsed.hostname or "").lower()
          user = parsed.username or ""

          if host.endswith(".pooler.supabase.com") and "." not in user:
              raise SystemExit(
                  "Invalid SUPABASE_DB_URL for Supabase pooler host: username must be "
                  "'postgres.<project_ref>' (not plain 'postgres')."
              )

          print(f"SUPABASE_DB_URL looks valid for host={host}, user={user}.")
          PY

      - name: Pause OpenAQ polling
        id: pause_openaq_polling
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import requests

          supabase_url = os.environ.get("SUPABASE_URL")
          supabase_key = os.environ.get("SB_SECRET_KEY")
          if not supabase_url or not supabase_key:
              raise SystemExit("SUPABASE_URL and SB_SECRET_KEY are required.")
          url = f"{supabase_url}/rest/v1/connectors"
          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
              "Content-Type": "application/json",
              "Accept-Profile": "uk_aq_core",
              "Content-Profile": "uk_aq_core",
          }
          check = requests.get(
              url,
              params={"connector_code": "eq.openaq", "select": "id,poll_enabled"},
              headers=headers,
              timeout=30,
          )
          check.raise_for_status()
          rows = check.json()
          connector_found = bool(rows)
          raw_poll_enabled = rows[0].get("poll_enabled") if rows else None
          if isinstance(raw_poll_enabled, bool):
              poll_enabled = raw_poll_enabled
          elif isinstance(raw_poll_enabled, (int, float)):
              poll_enabled = raw_poll_enabled != 0
          elif isinstance(raw_poll_enabled, str):
              poll_enabled = raw_poll_enabled.strip().lower() in {"1", "true", "t", "yes", "on"}
          else:
              poll_enabled = False
          resp = requests.patch(
              url,
              params={"connector_code": "eq.openaq"},
              headers=headers,
              json={"poll_enabled": False},
              timeout=30,
          ) if connector_found and poll_enabled else None
          if resp is not None:
              resp.raise_for_status()
              print("Paused openaq polling.")
          else:
              print(
                  "Skipped pause for openaq (connector_found="
                  f"{connector_found}, poll_enabled={poll_enabled})."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"connector_found={'1' if connector_found else '0'}\n")
              handle.write(f"poll_was_enabled={'1' if poll_enabled else '0'}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"OPENAQ_POLL_WAS_ENABLED={'1' if poll_enabled else '0'}\n")
          PY

      - name: Sync UK-AIR SOS stations
        id: sync_sos_stations
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          set +e
          python3 scripts/sos/sos_list_stations.py --to-supabase
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 75 ]; then
            echo "upstream_unavailable=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Reject non-isolated UK-AIR SOS station sync failure
        if: steps.sync_sos_stations.outcome == 'failure' && steps.sync_sos_stations.outputs.upstream_unavailable != 'true'
        run: |
          echo "ERROR: UK-AIR SOS station sync failed for a non-isolated reason."
          exit 1

      - name: Pause UK-AIR SOS polling
        id: pause_sos_polling
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import requests

          supabase_url = os.environ.get("SUPABASE_URL")
          supabase_key = os.environ.get("SB_SECRET_KEY")
          if not supabase_url or not supabase_key:
              raise SystemExit("SUPABASE_URL and SB_SECRET_KEY are required.")
          url = f"{supabase_url}/rest/v1/connectors"
          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
              "Content-Type": "application/json",
              "Accept-Profile": "uk_aq_core",
              "Content-Profile": "uk_aq_core",
          }
          check = requests.get(
              url,
              params={"connector_code": "eq.sos", "select": "id,poll_enabled"},
              headers=headers,
              timeout=30,
          )
          check.raise_for_status()
          rows = check.json()
          connector_found = bool(rows)
          raw_poll_enabled = rows[0].get("poll_enabled") if rows else None
          if isinstance(raw_poll_enabled, bool):
              poll_enabled = raw_poll_enabled
          elif isinstance(raw_poll_enabled, (int, float)):
              poll_enabled = raw_poll_enabled != 0
          elif isinstance(raw_poll_enabled, str):
              poll_enabled = raw_poll_enabled.strip().lower() in {"1", "true", "t", "yes", "on"}
          else:
              poll_enabled = False
          resp = requests.patch(
              url,
              params={"connector_code": "eq.sos"},
              headers=headers,
              json={"poll_enabled": False},
              timeout=30,
          ) if connector_found and poll_enabled else None
          if resp is not None:
              resp.raise_for_status()
              print("Paused sos polling.")
          else:
              print(
                  "Skipped pause for sos (connector_found="
                  f"{connector_found}, poll_enabled={poll_enabled})."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"connector_found={'1' if connector_found else '0'}\n")
              handle.write(f"poll_was_enabled={'1' if poll_enabled else '0'}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SOS_POLL_WAS_ENABLED={'1' if poll_enabled else '0'}\n")
          PY

      - name: Discover UK-AIR SOS timeseries
        id: discover_sos_timeseries
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          set +e
          python3 scripts/sos/sos_ingest.py --discover
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 75 ]; then
            echo "upstream_unavailable=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Resume UK-AIR SOS polling
        id: resume_sos_polling
        if: always() && steps.pause_sos_polling.outputs.poll_was_enabled == '1'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import requests

          supabase_url = os.environ.get("SUPABASE_URL")
          supabase_key = os.environ.get("SB_SECRET_KEY")
          if not supabase_url or not supabase_key:
              raise SystemExit("SUPABASE_URL and SB_SECRET_KEY are required.")
          url = f"{supabase_url}/rest/v1/connectors"
          resp = requests.patch(
              url,
              params={"connector_code": "eq.sos"},
              headers={
                  "apikey": supabase_key,
                  "Authorization": f"Bearer {supabase_key}",
                  "Content-Type": "application/json",
                  "Accept-Profile": "uk_aq_core",
                  "Content-Profile": "uk_aq_core",
              },
              json={"poll_enabled": True},
              timeout=30,
          )
          resp.raise_for_status()
          print("Resumed sos polling.")
          PY

      - name: Keep UK-AIR SOS polling unchanged
        if: always() && (steps.pause_sos_polling.outputs.connector_found != '1' || steps.pause_sos_polling.outputs.poll_was_enabled != '1')
        run: |
          echo "Leaving UK-AIR SOS polling unchanged (workflow did not pause it)."

      - name: Reject non-isolated UK-AIR SOS timeseries discovery failure
        if: >-
          always() &&
          steps.discover_sos_timeseries.outcome == 'failure' &&
          steps.discover_sos_timeseries.outputs.upstream_unavailable != 'true'
        run: |
          echo "ERROR: UK-AIR SOS timeseries discovery failed for a non-isolated reason."
          exit 1

      - name: Refresh UK-AIR Black Carbon reference metadata
        id: refresh_ukair_bc_reference
        if: always() && job.status == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          UKAIR_BC_SITE_SEARCH_URL: ${{ vars.UKAIR_BC_SITE_SEARCH_URL }}
        run: |
          set +e
          python3 scripts/ukair_bc/ukair_bc_reference_refresh.py --to-supabase
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 75 ]; then
            echo "upstream_unavailable=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Reject non-isolated UK-AIR Black Carbon reference failure
        if: >-
          always() &&
          steps.refresh_ukair_bc_reference.outcome == 'failure' &&
          (steps.refresh_ukair_bc_reference.outputs.exit_code != '75' ||
           steps.refresh_ukair_bc_reference.outputs.upstream_unavailable != 'true')
        run: |
          echo "ERROR: UK-AIR Black Carbon reference refresh failed for a non-isolated reason."
          exit 1

      - name: Sync Breathe London Communities stations
        id: sync_blondon_communities_stations
        if: always() && job.status == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          BLONDON_COMMUNITIES_API_KEY: ${{ secrets.BLONDON_COMMUNITIES_API_KEY }}
        run: |
          set +e
          python3 scripts/blondon_communities/blondon_communities_list_stations.py \
            --to-supabase --daily-stations-isolate-source-failure
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 75 ]; then
            echo "isolated_source_failure=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Reject non-isolated Breathe London Communities station import failure
        if: >-
          always() && steps.sync_blondon_communities_stations.outcome == 'failure' &&
          (steps.sync_blondon_communities_stations.outputs.exit_code != '75' ||
           steps.sync_blondon_communities_stations.outputs.isolated_source_failure != 'true' ||
           steps.sync_blondon_communities_stations.outputs.retained_references_verified != 'true')
        run: |
          echo "ERROR: Breathe London Communities station import failed for a non-isolated reason."
          exit 1

      - name: Discover Breathe London Communities timeseries
        id: discover_blondon_communities_timeseries
        if: success() && steps.sync_blondon_communities_stations.outcome == 'success'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          node scripts/blondon_communities/blondon_communities_discover_timeseries.mjs

      - name: Require complete Breathe London Communities reference stage
        if: >-
          always() && job.status == 'success' &&
          !((steps.sync_blondon_communities_stations.outcome == 'success' &&
             steps.discover_blondon_communities_timeseries.outcome == 'success') ||
            (steps.sync_blondon_communities_stations.outcome == 'failure' &&
             steps.sync_blondon_communities_stations.outputs.exit_code == '75' &&
             steps.sync_blondon_communities_stations.outputs.isolated_source_failure == 'true' &&
             steps.sync_blondon_communities_stations.outputs.retained_references_verified == 'true' &&
             steps.discover_blondon_communities_timeseries.outcome == 'skipped'))
        run: |
          echo "ERROR: Breathe London Communities discovery or complete retained-reference verification is required."
          exit 1

      - name: Sync Breathe London Nodes stations
        id: sync_blondon_nodes_stations
        if: always() && job.status == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          BLONDON_NODES_API_KEY: ${{ secrets.BLONDON_NODES_API_KEY }}
        run: |
          set +e
          python3 scripts/blondon_nodes/blondon_nodes_list_stations.py \
            --to-supabase --daily-stations-isolate-source-failure
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 75 ]; then
            echo "isolated_source_failure=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Reject non-isolated Breathe London Nodes station import failure
        if: >-
          always() && steps.sync_blondon_nodes_stations.outcome == 'failure' &&
          (steps.sync_blondon_nodes_stations.outputs.exit_code != '75' ||
           steps.sync_blondon_nodes_stations.outputs.isolated_source_failure != 'true' ||
           steps.sync_blondon_nodes_stations.outputs.retained_references_verified != 'true')
        run: |
          echo "ERROR: Breathe London Nodes station import failed for a non-isolated reason."
          exit 1

      - name: Discover Breathe London Nodes timeseries
        id: discover_blondon_nodes_timeseries
        if: success() && steps.sync_blondon_nodes_stations.outcome == 'success'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          python3 scripts/blondon_nodes/blondon_nodes_discover_timeseries.py

      - name: Require complete Breathe London Nodes reference stage
        if: >-
          always() && job.status == 'success' &&
          !((steps.sync_blondon_nodes_stations.outcome == 'success' &&
             steps.discover_blondon_nodes_timeseries.outcome == 'success') ||
            (steps.sync_blondon_nodes_stations.outcome == 'failure' &&
             steps.sync_blondon_nodes_stations.outputs.exit_code == '75' &&
             steps.sync_blondon_nodes_stations.outputs.isolated_source_failure == 'true' &&
             steps.sync_blondon_nodes_stations.outputs.retained_references_verified == 'true' &&
             steps.discover_blondon_nodes_timeseries.outcome == 'skipped'))
        run: |
          echo "ERROR: Breathe London Nodes discovery or complete retained-reference verification is required."
          exit 1

      # Script needs updating before LAQN can start polling
      # - name: Sync LAQN stations
      #   env:
      #     SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      #     SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
      #   run: |
      #     python3 scripts/erg_laqn/erg_laqn_list_stations.py --to-supabase

      - name: Sync OpenAQ stations
        id: sync_openaq_stations
        if: always() && job.status == 'success' && steps.pause_openaq_polling.outputs.connector_found == '1' && steps.pause_openaq_polling.outputs.poll_was_enabled == '1'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.DATABASE_URL }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          OPENAQ_RATE_LIMIT_PER_MIN: ${{ vars.OPENAQ_RATE_LIMIT_PER_MIN || '60' }}
          OPENAQ_SHARED_BUDGET_ENFORCE: ${{ vars.OPENAQ_SHARED_BUDGET_ENFORCE || 'true' }}
          OPENAQ_SHARED_BUDGET_KEY: ${{ vars.OPENAQ_SHARED_BUDGET_KEY || 'openaq' }}
          OPENAQ_SHARED_BUDGET_MINUTE_LIMIT: ${{ vars.OPENAQ_SHARED_BUDGET_MINUTE_LIMIT || '50' }}
          OPENAQ_SHARED_BUDGET_HOUR_LIMIT: ${{ vars.OPENAQ_SHARED_BUDGET_HOUR_LIMIT || '1900' }}
          OPENAQ_SHARED_BUDGET_FAIL_OPEN: ${{ vars.OPENAQ_SHARED_BUDGET_FAIL_OPEN || 'false' }}
        run: |
          set +e
          python3 scripts/openaq/openaq_list_stations.py \
            --to-supabase --daily-stations-isolate-source-failure
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 75 ]; then
            echo "isolated_source_failure=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Skip OpenAQ stations sync (polling already off or connector missing)
        if: steps.pause_openaq_polling.outputs.connector_found != '1' || steps.pause_openaq_polling.outputs.poll_was_enabled != '1'
        run: |
          echo "Skipping OpenAQ stations sync because connector missing or polling was already off."

      - name: Resume OpenAQ polling
        id: resume_openaq_polling
        if: always() && steps.pause_openaq_polling.outputs.poll_was_enabled == '1'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import requests

          supabase_url = os.environ.get("SUPABASE_URL")
          supabase_key = os.environ.get("SB_SECRET_KEY")
          if not supabase_url or not supabase_key:
              raise SystemExit("SUPABASE_URL and SB_SECRET_KEY are required.")
          url = f"{supabase_url}/rest/v1/connectors"
          resp = requests.patch(
              url,
              params={"connector_code": "eq.openaq"},
              headers={
                  "apikey": supabase_key,
                  "Authorization": f"Bearer {supabase_key}",
                  "Content-Type": "application/json",
                  "Accept-Profile": "uk_aq_core",
                  "Content-Profile": "uk_aq_core",
              },
              json={"poll_enabled": True},
              timeout=30,
          )
          resp.raise_for_status()
          print("Resumed openaq polling.")
          PY

      - name: Keep OpenAQ polling unchanged
        if: always() && (steps.pause_openaq_polling.outputs.connector_found != '1' || steps.pause_openaq_polling.outputs.poll_was_enabled != '1')
        run: |
          echo "Leaving OpenAQ polling unchanged (workflow did not pause it)."

      - name: Guard OpenAQ pause path requires sync and resume
        if: >
          always() &&
          job.status == 'success' &&
          steps.pause_openaq_polling.outputs.connector_found == '1' &&
          steps.pause_openaq_polling.outputs.poll_was_enabled == '1'
        run: |
          echo "sync_openaq_stations conclusion: ${{ steps.sync_openaq_stations.conclusion }}"
          echo "resume_openaq_polling conclusion: ${{ steps.resume_openaq_polling.conclusion }}"
          if [ "${{ steps.sync_openaq_stations.conclusion }}" = "skipped" ]; then
            echo "ERROR: OpenAQ polling was paused, but Sync OpenAQ stations was skipped."
            exit 1
          fi
          if [ "${{ steps.resume_openaq_polling.outcome }}" != "success" ]; then
            echo "ERROR: OpenAQ polling was paused, but restoration did not succeed."
            exit 1
          fi

      - name: Reject non-isolated OpenAQ station import failure
        if: >-
          always() && steps.sync_openaq_stations.outcome == 'failure' &&
          (steps.sync_openaq_stations.outputs.exit_code != '75' ||
           steps.sync_openaq_stations.outputs.isolated_source_failure != 'true' ||
           steps.sync_openaq_stations.outputs.retained_references_verified != 'true')
        run: |
          echo "ERROR: OpenAQ station import failed for a non-isolated reason."
          exit 1

      - name: Discover Sensor.Community stations (optional)
        id: export_sensorcommunity_stations
        continue-on-error: true
        if: always() && job.status == 'success' && env.RUN_SCOMM_STATIONS_EXPORT == '1'
        run: |
          set +e
          python3 scripts/sensorcommunity/sensorcommunity_list_stations.py \
            --output "${SCOMM_CONNECTOR_CODE}_stations.json" \
            --daily-stations-isolate-source-failure
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 75 ]; then
            echo "isolated_source_failure=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Reject non-isolated Sensor.Community export failure
        if: >-
          always() && steps.export_sensorcommunity_stations.outcome == 'failure' &&
          (steps.export_sensorcommunity_stations.outputs.exit_code != '75' ||
           steps.export_sensorcommunity_stations.outputs.isolated_source_failure != 'true' ||
           steps.export_sensorcommunity_stations.outputs.read_only_export != 'true')
        run: |
          echo "ERROR: Optional Sensor.Community export failed for a non-isolated reason."
          exit 1


      - name: Backfill Sensor.Community timeseries phenomena
        id: backfill_sensorcommunity_phenomena
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          python3 scripts/sensorcommunity/sensorcommunity_backfill_timeseries_phenomena.py

      - name: Refresh WAQN references from OpenAir metadata
        id: refresh_waqn_reference
        if: always() && job.status == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          set +e
          python3 scripts/official_networks/openair_reference.py \
            --connector-code waqn \
            --skip-if-unconfigured \
            --daily-stations-isolate-source-failure
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 75 ]; then
            echo "isolated_source_failure=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Reject non-isolated WAQN reference failure
        if: >-
          always() &&
          steps.refresh_waqn_reference.outcome == 'failure' &&
          (steps.refresh_waqn_reference.outputs.exit_code != '75' ||
           steps.refresh_waqn_reference.outputs.isolated_source_failure != 'true' ||
           steps.refresh_waqn_reference.outputs.retained_references_verified != 'true')
        run: |
          echo "ERROR: WAQN reference refresh failed for a non-isolated reason."
          exit 1

      - name: Refresh SAQN references from OpenAir metadata
        id: refresh_saqn_reference
        if: always() && job.status == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          set +e
          python3 scripts/official_networks/openair_reference.py \
            --connector-code saqn \
            --skip-if-unconfigured \
            --daily-stations-isolate-source-failure
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 75 ]; then
            echo "isolated_source_failure=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Reject non-isolated SAQN reference failure
        if: >-
          always() &&
          steps.refresh_saqn_reference.outcome == 'failure' &&
          (steps.refresh_saqn_reference.outputs.exit_code != '75' ||
           steps.refresh_saqn_reference.outputs.isolated_source_failure != 'true' ||
           steps.refresh_saqn_reference.outputs.retained_references_verified != 'true')
        run: |
          echo "ERROR: SAQN reference refresh failed for a non-isolated reason."
          exit 1

      - name: Refresh Northern Ireland references from OpenAir metadata
        id: refresh_ni_reference
        if: always() && job.status == 'success'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          set +e
          python3 scripts/official_networks/openair_reference.py \
            --connector-code ni \
            --skip-if-unconfigured \
            --daily-stations-isolate-source-failure
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 75 ]; then
            echo "isolated_source_failure=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"

      - name: Reject non-isolated Northern Ireland reference failure
        if: >-
          always() &&
          steps.refresh_ni_reference.outcome == 'failure' &&
          (steps.refresh_ni_reference.outputs.exit_code != '75' ||
           steps.refresh_ni_reference.outputs.isolated_source_failure != 'true' ||
           steps.refresh_ni_reference.outputs.retained_references_verified != 'true')
        run: |
          echo "ERROR: Northern Ireland reference refresh failed for a non-isolated reason."
          exit 1

      - name: Resolve canonical physical monitoring sites
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          python3 scripts/official_networks/canonical_site_resolver.py

      - name: Refresh station PCON/LA from R2 shards
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID: ${{ vars.UK_AQ_DOMAIN_CLOUDFLARE_ACCOUNT_ID }}
          UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN: ${{ secrets.UK_AQ_DOMAIN_CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/uk_aq_refresh_station_geo_r2.py

      - name: Check null station_name
        id: check_null_station_name
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import requests

          supabase_url = os.environ.get("SUPABASE_URL")
          supabase_key = os.environ.get("SB_SECRET_KEY")
          core_schema = os.environ.get("UK_AQ_CORE_SCHEMA", "uk_aq_core")
          if not supabase_url or not supabase_key:
            raise SystemExit("SUPABASE_URL and SB_SECRET_KEY are required.")

          def count_null(field, require_geometry=False, label=None):
            params = [f"select=id", f"{field}=is.null"]
            if require_geometry:
              params.append("geometry=not.is.null")
            url = f"{supabase_url}/rest/v1/stations?{'&'.join(params)}"
            resp = requests.get(
              url,
              headers={
                "apikey": supabase_key,
                "Authorization": f"Bearer {supabase_key}",
                "Prefer": "count=exact",
                "Accept-Profile": core_schema,
                "Content-Profile": core_schema,
              },
              timeout=30,
            )
            if label:
              print(f"{label} url={url} status={resp.status_code}")
            resp.raise_for_status()
            content_range = resp.headers.get("content-range", "")
            if label:
              print(f"{label} content-range={content_range!r}")
            match = re.search(r"/(\d+)$", content_range)
            if not match:
              return 0
            return int(match.group(1))

          project_ref = None
          match = re.search(r"https?://([^./]+)\.supabase\.(co|in)", supabase_url)
          if match:
            project_ref = match.group(1)
          print(f"Supabase project ref: {project_ref or '<unknown>'}")

          station_name_missing_all = count_null(
            "station_name",
            require_geometry=False,
            label="station_name_null_all",
          )
          station_name_missing = count_null(
            "station_name",
            require_geometry=True,
            label="station_name_null_with_geometry",
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
            handle.write(f"STATION_NAME_NULL_COUNT={station_name_missing}\n")
            handle.write(f"STATION_NAME_NULL_COUNT_ALL={station_name_missing_all}\n")
            handle.write(f"STATION_NAME_SHOULD_RUN={'1' if station_name_missing > 0 else '0'}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"station_name_null_count={station_name_missing}\n")
            handle.write(f"station_name_null_count_all={station_name_missing_all}\n")
            handle.write(f"station_name_should_run={'1' if station_name_missing > 0 else '0'}\n")

          print(
            "Missing station_name:",
            station_name_missing,
            "(all rows:",
            station_name_missing_all,
            ")",
          )
          PY

      - name: Debug station_name outputs
        run: |
          echo "station_name_null_count=${{ steps.check_null_station_name.outputs.station_name_null_count }}"
          echo "station_name_null_count_all=${{ steps.check_null_station_name.outputs.station_name_null_count_all }}"
          echo "station_name_should_run=${{ steps.check_null_station_name.outputs.station_name_should_run }}"
          echo "STATION_NAME_NULL_COUNT=$STATION_NAME_NULL_COUNT"
          echo "STATION_NAME_NULL_COUNT_ALL=$STATION_NAME_NULL_COUNT_ALL"
          echo "STATION_NAME_SHOULD_RUN=$STATION_NAME_SHOULD_RUN"

      - name: Enrich station names
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          UK_AQ_OS_OPEN_NAMES_GB_DROPBOX_PATH: ${{ secrets.UK_AQ_OS_OPEN_NAMES_GB_DROPBOX_PATH }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import requests

          supabase_url = os.environ.get("SUPABASE_URL")
          supabase_key = os.environ.get("SB_SECRET_KEY")
          core_schema = os.environ.get("UK_AQ_CORE_SCHEMA", "uk_aq_core")
          if not supabase_url or not supabase_key:
            raise SystemExit("SUPABASE_URL and SB_SECRET_KEY are required.")

          def count_null(field, require_geometry=False):
            params = [f"select=id", f"{field}=is.null"]
            if require_geometry:
              params.append("geometry=not.is.null")
            url = f"{supabase_url}/rest/v1/stations?{'&'.join(params)}"
            resp = requests.get(
              url,
              headers={
                "apikey": supabase_key,
                "Authorization": f"Bearer {supabase_key}",
                "Prefer": "count=exact",
                "Accept-Profile": core_schema,
                "Content-Profile": core_schema,
              },
              timeout=30,
            )
            resp.raise_for_status()
            content_range = resp.headers.get("content-range", "")
            match = re.search(r"/(\d+)$", content_range)
            if not match:
              return 0
            return int(match.group(1))

          missing_with_geometry = count_null("station_name", require_geometry=True)
          should_run = 1 if missing_with_geometry > 0 else 0
          with open("station_name_should_run.env", "w", encoding="utf-8") as handle:
            handle.write(f"STATION_NAME_SHOULD_RUN={should_run}\n")
          print(f"station_name_missing_with_geometry={missing_with_geometry}")
          print(f"station_name_should_run={should_run}")
          PY
          source station_name_should_run.env
          if [ "$STATION_NAME_SHOULD_RUN" != "1" ]; then
            echo "No missing station_name with geometry; skipping enrichment."
            exit 0
          fi
          python3 scripts/uk_aq_enrich_station_names.py --apply

      - name: Export stations to Dropbox
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.DATABASE_URL }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          UK_AQ_DROPBOX_ROOT: ${{ vars.UK_AQ_DROPBOX_ROOT }}
        run: |
          python3 scripts/uk_aq_export_stations_dropbox.py

      - name: Sync uk_aq_core reference tables to Obs AQI DB
        id: mirror_core_references
        if: >-
          success() &&
          (steps.refresh_ukair_bc_reference.outcome == 'success' ||
           (steps.refresh_ukair_bc_reference.outcome == 'failure' &&
            steps.refresh_ukair_bc_reference.outputs.exit_code == '75' &&
            steps.refresh_ukair_bc_reference.outputs.upstream_unavailable == 'true')) &&
          (steps.refresh_waqn_reference.outcome == 'success' ||
           (steps.refresh_waqn_reference.outcome == 'failure' &&
            steps.refresh_waqn_reference.outputs.exit_code == '75' &&
            steps.refresh_waqn_reference.outputs.isolated_source_failure == 'true' &&
            steps.refresh_waqn_reference.outputs.retained_references_verified == 'true')) &&
          (steps.refresh_saqn_reference.outcome == 'success' ||
           (steps.refresh_saqn_reference.outcome == 'failure' &&
            steps.refresh_saqn_reference.outputs.exit_code == '75' &&
            steps.refresh_saqn_reference.outputs.isolated_source_failure == 'true' &&
            steps.refresh_saqn_reference.outputs.retained_references_verified == 'true')) &&
          (steps.refresh_ni_reference.outcome == 'success' ||
           (steps.refresh_ni_reference.outcome == 'failure' &&
            steps.refresh_ni_reference.outputs.exit_code == '75' &&
            steps.refresh_ni_reference.outputs.isolated_source_failure == 'true' &&
            steps.refresh_ni_reference.outputs.retained_references_verified == 'true')) &&
          ((steps.sync_blondon_communities_stations.outcome == 'success' &&
            steps.discover_blondon_communities_timeseries.outcome == 'success') ||
           (steps.sync_blondon_communities_stations.outcome == 'failure' &&
            steps.sync_blondon_communities_stations.outputs.exit_code == '75' &&
            steps.sync_blondon_communities_stations.outputs.isolated_source_failure == 'true' &&
            steps.sync_blondon_communities_stations.outputs.retained_references_verified == 'true' &&
            steps.discover_blondon_communities_timeseries.outcome == 'skipped')) &&
          ((steps.sync_blondon_nodes_stations.outcome == 'success' &&
            steps.discover_blondon_nodes_timeseries.outcome == 'success') ||
           (steps.sync_blondon_nodes_stations.outcome == 'failure' &&
            steps.sync_blondon_nodes_stations.outputs.exit_code == '75' &&
            steps.sync_blondon_nodes_stations.outputs.isolated_source_failure == 'true' &&
            steps.sync_blondon_nodes_stations.outputs.retained_references_verified == 'true' &&
            steps.discover_blondon_nodes_timeseries.outcome == 'skipped')) &&
          ((steps.pause_openaq_polling.outputs.poll_was_enabled != '1' &&
            steps.sync_openaq_stations.outcome == 'skipped') ||
           (steps.pause_openaq_polling.outputs.connector_found == '1' &&
            steps.pause_openaq_polling.outputs.poll_was_enabled == '1' &&
            steps.resume_openaq_polling.outcome == 'success' &&
            (steps.sync_openaq_stations.outcome == 'success' ||
             (steps.sync_openaq_stations.outcome == 'failure' &&
              steps.sync_openaq_stations.outputs.exit_code == '75' &&
              steps.sync_openaq_stations.outputs.isolated_source_failure == 'true' &&
              steps.sync_openaq_stations.outputs.retained_references_verified == 'true')))) &&
          steps.backfill_sensorcommunity_phenomena.outcome == 'success' &&
          ((env.RUN_SCOMM_STATIONS_EXPORT != '1' &&
            steps.export_sensorcommunity_stations.outcome == 'skipped') ||
           (env.RUN_SCOMM_STATIONS_EXPORT == '1' &&
            (steps.export_sensorcommunity_stations.outcome == 'success' ||
             (steps.export_sensorcommunity_stations.outcome == 'failure' &&
              steps.export_sensorcommunity_stations.outputs.exit_code == '75' &&
              steps.export_sensorcommunity_stations.outputs.isolated_source_failure == 'true' &&
              steps.export_sensorcommunity_stations.outputs.read_only_export == 'true'))))
        env:
          SRC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SRC_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          DST_SUPABASE_URL: ${{ vars.OBS_AQIDB_SUPABASE_URL }}
          DST_SECRET_KEY: ${{ secrets.OBS_AQIDB_SECRET_KEY }}
          SYNC_TARGET_LABEL: obs_aqidb
          SYNC_CALLER_PREFIX: stations_daily_sync_obs_aqidb
          OBS_AQIDB_REPAIR_OBSERVED_PROPERTY_IDS: ${{ vars.OBS_AQIDB_REPAIR_OBSERVED_PROPERTY_IDS }}
        run: |
          python3 scripts/stations_daily/sync_obs_aqidb_uk_aq_core.py

      - name: Require successful final reference mirror
        if: always() && job.status == 'success' && steps.mirror_core_references.outcome != 'success'
        run: |
          echo "ERROR: Required final reference mirror did not succeed."
          exit 1

      - name: Build isolated reference warning summary
        if: always()
        env:
          SYNC_SOS_STATIONS_OUTCOME: ${{ steps.sync_sos_stations.outcome }}
          SYNC_SOS_STATIONS_UPSTREAM_UNAVAILABLE: ${{ steps.sync_sos_stations.outputs.upstream_unavailable }}
          DISCOVER_SOS_TIMESERIES_OUTCOME: ${{ steps.discover_sos_timeseries.outcome }}
          DISCOVER_SOS_TIMESERIES_UPSTREAM_UNAVAILABLE: ${{ steps.discover_sos_timeseries.outputs.upstream_unavailable }}
          REFRESH_UKAIR_BC_OUTCOME: ${{ steps.refresh_ukair_bc_reference.outcome }}
          REFRESH_UKAIR_BC_EXIT_CODE: ${{ steps.refresh_ukair_bc_reference.outputs.exit_code }}
          REFRESH_UKAIR_BC_UPSTREAM_UNAVAILABLE: ${{ steps.refresh_ukair_bc_reference.outputs.upstream_unavailable }}
          REFRESH_UKAIR_BC_FAILURE_CLASS: ${{ steps.refresh_ukair_bc_reference.outputs.failure_class }}
          REFRESH_WAQN_OUTCOME: ${{ steps.refresh_waqn_reference.outcome }}
          REFRESH_WAQN_EXIT_CODE: ${{ steps.refresh_waqn_reference.outputs.exit_code }}
          REFRESH_WAQN_ISOLATED_SOURCE_FAILURE: ${{ steps.refresh_waqn_reference.outputs.isolated_source_failure }}
          REFRESH_WAQN_RETAINED_REFERENCES_VERIFIED: ${{ steps.refresh_waqn_reference.outputs.retained_references_verified }}
          REFRESH_WAQN_FAILURE_CLASS: ${{ steps.refresh_waqn_reference.outputs.failure_class }}
          REFRESH_SAQN_OUTCOME: ${{ steps.refresh_saqn_reference.outcome }}
          REFRESH_SAQN_EXIT_CODE: ${{ steps.refresh_saqn_reference.outputs.exit_code }}
          REFRESH_SAQN_ISOLATED_SOURCE_FAILURE: ${{ steps.refresh_saqn_reference.outputs.isolated_source_failure }}
          REFRESH_SAQN_RETAINED_REFERENCES_VERIFIED: ${{ steps.refresh_saqn_reference.outputs.retained_references_verified }}
          REFRESH_SAQN_FAILURE_CLASS: ${{ steps.refresh_saqn_reference.outputs.failure_class }}
          REFRESH_NI_OUTCOME: ${{ steps.refresh_ni_reference.outcome }}
          REFRESH_NI_EXIT_CODE: ${{ steps.refresh_ni_reference.outputs.exit_code }}
          REFRESH_NI_ISOLATED_SOURCE_FAILURE: ${{ steps.refresh_ni_reference.outputs.isolated_source_failure }}
          REFRESH_NI_RETAINED_REFERENCES_VERIFIED: ${{ steps.refresh_ni_reference.outputs.retained_references_verified }}
          REFRESH_NI_FAILURE_CLASS: ${{ steps.refresh_ni_reference.outputs.failure_class }}
          REFRESH_BLONDON_COMMUNITIES_OUTCOME: ${{ steps.sync_blondon_communities_stations.outcome }}
          REFRESH_BLONDON_COMMUNITIES_EXIT_CODE: ${{ steps.sync_blondon_communities_stations.outputs.exit_code }}
          REFRESH_BLONDON_COMMUNITIES_ISOLATED_SOURCE_FAILURE: ${{ steps.sync_blondon_communities_stations.outputs.isolated_source_failure }}
          REFRESH_BLONDON_COMMUNITIES_RETAINED_REFERENCES_VERIFIED: ${{ steps.sync_blondon_communities_stations.outputs.retained_references_verified }}
          REFRESH_BLONDON_COMMUNITIES_FAILURE_CLASS: ${{ steps.sync_blondon_communities_stations.outputs.failure_class }}
          REFRESH_BLONDON_NODES_OUTCOME: ${{ steps.sync_blondon_nodes_stations.outcome }}
          REFRESH_BLONDON_NODES_EXIT_CODE: ${{ steps.sync_blondon_nodes_stations.outputs.exit_code }}
          REFRESH_BLONDON_NODES_ISOLATED_SOURCE_FAILURE: ${{ steps.sync_blondon_nodes_stations.outputs.isolated_source_failure }}
          REFRESH_BLONDON_NODES_RETAINED_REFERENCES_VERIFIED: ${{ steps.sync_blondon_nodes_stations.outputs.retained_references_verified }}
          REFRESH_BLONDON_NODES_FAILURE_CLASS: ${{ steps.sync_blondon_nodes_stations.outputs.failure_class }}
          REFRESH_OPENAQ_OUTCOME: ${{ steps.sync_openaq_stations.outcome }}
          REFRESH_OPENAQ_EXIT_CODE: ${{ steps.sync_openaq_stations.outputs.exit_code }}
          REFRESH_OPENAQ_ISOLATED_SOURCE_FAILURE: ${{ steps.sync_openaq_stations.outputs.isolated_source_failure }}
          REFRESH_OPENAQ_RETAINED_REFERENCES_VERIFIED: ${{ steps.sync_openaq_stations.outputs.retained_references_verified }}
          REFRESH_OPENAQ_FAILURE_CLASS: ${{ steps.sync_openaq_stations.outputs.failure_class }}
          EXPORT_SCOMM_OUTCOME: ${{ steps.export_sensorcommunity_stations.outcome }}
          EXPORT_SCOMM_EXIT_CODE: ${{ steps.export_sensorcommunity_stations.outputs.exit_code }}
          EXPORT_SCOMM_ISOLATED_SOURCE_FAILURE: ${{ steps.export_sensorcommunity_stations.outputs.isolated_source_failure }}
          EXPORT_SCOMM_READ_ONLY_EXPORT: ${{ steps.export_sensorcommunity_stations.outputs.read_only_export }}
          EXPORT_SCOMM_FAILURE_CLASS: ${{ steps.export_sensorcommunity_stations.outputs.failure_class }}
          SUPPLEMENTAL_SUMMARY_FILE: ${{ runner.temp }}/daily-stations-health-summary.json
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const stages = [
            ["sync_sos_stations", process.env.SYNC_SOS_STATIONS_OUTCOME, process.env.SYNC_SOS_STATIONS_UPSTREAM_UNAVAILABLE],
            ["discover_sos_timeseries", process.env.DISCOVER_SOS_TIMESERIES_OUTCOME, process.env.DISCOVER_SOS_TIMESERIES_UPSTREAM_UNAVAILABLE],
          ]
            .filter(([, outcome, unavailable]) => outcome === "failure" && unavailable === "true")
            .map(([stage]) => stage);

          const warnings = [];
          if (stages.length > 0) {
            warnings.push({
              code: "uk_air_sos_reference_refresh_failed",
              reason: "UK-AIR SOS station/reference refresh was unavailable; existing SOS reference data was retained.",
              connector_code: "sos",
              stages,
            });
            console.warn(`UK-AIR SOS reference refresh warning recorded for: ${stages.join(", ")}.`);
          }
          if (process.env.REFRESH_UKAIR_BC_OUTCOME === "failure"
              && process.env.REFRESH_UKAIR_BC_EXIT_CODE === "75"
              && process.env.REFRESH_UKAIR_BC_UPSTREAM_UNAVAILABLE === "true") {
            const failureClass = process.env.REFRESH_UKAIR_BC_FAILURE_CLASS;
            const allowedClasses = new Set(["upstream_timeout", "upstream_connection", "http_408", "http_429", "http_5xx", "maintenance_redirect"]);
            warnings.push({
              code: "uk_air_bc_reference_refresh_failed",
              reason: "UK-AIR Black Carbon reference refresh was temporarily unavailable; existing safe reference data were retained.",
              connector_code: "ukair_bc",
              stages: ["refresh_ukair_bc_reference"],
              ...(allowedClasses.has(failureClass) ? { failure_class: failureClass } : {}),
            });
            console.warn("UK-AIR Black Carbon reference refresh warning recorded.");
          }
          const officialClasses = new Set([
            "upstream_timeout", "upstream_connection", "http_408", "http_429", "http_500",
            "http_502", "http_503", "http_504", "unexpected_source_html", "unreadable_rdata",
          ]);
          for (const code of ["waqn", "saqn", "ni", "blondon_communities", "blondon_nodes", "openaq"]) {
            const prefix = `REFRESH_${code.toUpperCase()}_`;
            if (process.env[`${prefix}OUTCOME`] !== "failure"
                || process.env[`${prefix}EXIT_CODE`] !== "75"
                || process.env[`${prefix}ISOLATED_SOURCE_FAILURE`] !== "true"
                || process.env[`${prefix}RETAINED_REFERENCES_VERIFIED`] !== "true") continue;
            const failureClass = process.env[`${prefix}FAILURE_CLASS`];
            warnings.push({
              code: `${code}_reference_refresh_failed`,
              reason: code === "openaq"
                ? "OpenAQ catalogue source refresh could not complete; existing verified reference rows were retained."
                : code.startsWith("blondon_")
                ? `${code} station catalogue could not be refreshed; the complete verified retained reference set was preserved.`
                : failureClass === "unreadable_rdata"
                ? `${code.toUpperCase()} OpenAir metadata source could not be read by the RData reader; existing verified reference rows were retained.`
                : `${code.toUpperCase()} OpenAir reference source refresh could not complete; existing verified reference rows were retained.`,
              connector_code: code,
              stages: [code === "openaq" ? "sync_openaq_stations" : code.startsWith("blondon_") ? `sync_${code}_stations` : `refresh_${code}_reference`],
              ...(officialClasses.has(failureClass)
                || (["waqn", "saqn", "ni"].includes(code) && failureClass === "official_maintenance_redirect")
                ? { failure_class: failureClass } : {}),
            });
            console.warn(`${code.toUpperCase()} reference refresh warning recorded.`);
          }
          if (process.env.EXPORT_SCOMM_OUTCOME === "failure"
              && process.env.EXPORT_SCOMM_EXIT_CODE === "75"
              && process.env.EXPORT_SCOMM_ISOLATED_SOURCE_FAILURE === "true"
              && process.env.EXPORT_SCOMM_READ_ONLY_EXPORT === "true") {
            const failureClass = process.env.EXPORT_SCOMM_FAILURE_CLASS;
            warnings.push({
              code: "sensorcommunity_station_export_failed",
              reason: "The optional Sensor.Community source export could not be refreshed; no authoritative reference writes were attempted.",
              connector_code: "sensorcommunity",
              stages: ["export_sensorcommunity_stations"],
              ...(officialClasses.has(failureClass) ? { failure_class: failureClass } : {}),
            });
            console.warn("Optional Sensor.Community station export warning recorded.");
          }
          const summary = warnings.length === 0 ? {} : { warnings };
          fs.writeFileSync(process.env.SUPPLEMENTAL_SUMMARY_FILE, JSON.stringify(summary));
          NODE

      - name: Report daily task health
        if: always()
        env:
          SUPABASE_URL: ${{ vars.OBS_AQIDB_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.OBS_AQIDB_SECRET_KEY }}
