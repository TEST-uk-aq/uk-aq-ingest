name: Deploy Sensor.Community Ingest Edge Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: latest
      - name: Deploy to TEST IngestDB
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          UK_AQ_ENV_NAME: ${{ vars.UK_AQ_ENV_NAME }}
          SB_UK_AQ_CRON_SECRET: ${{ secrets.SB_UK_AQ_CRON_SECRET }}
          INGESTDB_RETENTION_DAYS: ${{ vars.INGESTDB_RETENTION_DAYS }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_URL:-}"
          test "${UK_AQ_ENV_NAME:-}" = "TEST"
          test -n "${SUPABASE_PROJECT_REF:-}"
          if [[ ! "${SB_UK_AQ_CRON_SECRET:-}" =~ [^[:space:]] ]]; then
            echo "SB_UK_AQ_CRON_SECRET must be configured" >&2
            exit 1
          fi
          if ! [[ "${INGESTDB_RETENTION_DAYS:-}" =~ ^[1-9][0-9]*$ ]] || [ "${INGESTDB_RETENTION_DAYS}" -lt 2 ]; then
            echo "INGESTDB_RETENTION_DAYS must be at least 2" >&2
            exit 1
          fi
          if [[ ! "${SUPABASE_URL}" =~ ^https://([a-z0-9-]+)\.supabase\.co/?$ ]]; then
            echo "SUPABASE_URL is not a Supabase project URL" >&2
            exit 1
          fi
          PROJECT_REF="${BASH_REMATCH[1]}"
          if [ "${PROJECT_REF}" != "${SUPABASE_PROJECT_REF}" ]; then
            echo "SUPABASE_URL and SUPABASE_PROJECT_REF disagree" >&2
            exit 1
          fi
          supabase secrets set --project-ref "${PROJECT_REF}" \
            INGESTDB_RETENTION_DAYS="${INGESTDB_RETENTION_DAYS}" \
            SB_UK_AQ_CRON_SECRET="${SB_UK_AQ_CRON_SECRET}"
          supabase functions deploy ingest_sensorcommunity \
            --project-ref "${PROJECT_REF}" --no-verify-jwt
