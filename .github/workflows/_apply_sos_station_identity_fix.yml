name: Apply SOS station identity fix

on:
  push:
    branches:
      - main
    paths:
      - scripts/dev/_apply_sos_station_identity_fix.py
      - scripts/dev/_fix_sos_patch_anchor.py
      - .github/workflows/_apply_sos_station_identity_fix.yml

permissions:
  contents: write

concurrency:
  group: apply-sos-station-identity-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Adjust guarded patch anchor
        run: python3 scripts/dev/_fix_sos_patch_anchor.py

      - name: Apply guarded source patch
        run: python3 scripts/dev/_apply_sos_station_identity_fix.py

      - name: Check Python structure
        run: |
          python3 -m py_compile scripts/sos/sos_ingest.py
          python3 -m py_compile tests/test_sos_station_identity.py

      - name: Verify structural safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("scripts/sos/sos_ingest.py").read_text(encoding="utf-8")
          discover = source[source.index("    def discover_timeseries("):source.index("    def backfill_year(")]
          assert "created_rows" not in discover
          assert "Created station row" not in discover
          assert "_extract_station_ref_from_label(ts.get" not in discover
          assert "SOS timeseries station ownership change refused" in source
          assert "get_timeseries_station_id_map" in source
          print("SOS station identity structural guards passed")
          PY

      - name: Commit validated fix
        run: |
          git diff --check
          git rm -- \
            scripts/dev/_apply_sos_station_identity_fix.py \
            scripts/dev/_fix_sos_patch_anchor.py \
            .github/workflows/_apply_sos_station_identity_fix.yml
          git add -- \
            scripts/sos/sos_ingest.py \
            tests/test_sos_station_identity.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No SOS station identity changes were produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve canonical SOS station identity"
          git push origin HEAD:main
