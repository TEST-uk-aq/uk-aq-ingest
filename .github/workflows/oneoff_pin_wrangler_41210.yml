name: One-off pin Wrangler 4.121.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oneoff_pin_wrangler_41210.yml"

permissions:
  contents: write

jobs:
  pin-wrangler:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin Wrangler used by scheduler tooling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          npx_replacements = {
              Path("scripts/cloudflare/uk_aq_reconcile_ingest_scheduler_url.sh"): 3,
              Path(".github/workflows/uk_aq_cloudflare_scheduler_ingest_config_sync.yml"): 2,
              Path(".github/workflows/uk_aq_cloudflare_scheduler_ingest_deploy.yml"): 2,
          }

          for path, expected_count in npx_replacements.items():
              text = path.read_text(encoding="utf-8")
              old = "npx --yes wrangler@4 "
              new = "npx --yes wrangler@4.121.0 "
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit(
                      f"{path}: expected {expected_count} floating Wrangler calls, found {count}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          deploy_path = Path(".github/workflows/uk_aq_cloudflare_scheduler_ingest_deploy.yml")
          lines = deploy_path.read_text(encoding="utf-8").splitlines()
          output = []
          inside_wrangler_action = False
          inserted = 0
          for line in lines:
              if "uses: cloudflare/wrangler-action@" in line:
                  inside_wrangler_action = True
              output.append(line)
              if inside_wrangler_action and line.strip().startswith("accountId:"):
                  indent = line[: len(line) - len(line.lstrip())]
                  output.append(f'{indent}wranglerVersion: "4.121.0"')
                  inserted += 1
                  inside_wrangler_action = False

          if inserted != 2:
              raise SystemExit(
                  f"Expected to pin 2 wrangler-action steps, inserted {inserted}"
              )
          deploy_path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Structural checks
        run: |
          set -euo pipefail
          bash -n scripts/cloudflare/uk_aq_reconcile_ingest_scheduler_url.sh
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              "scripts/cloudflare/uk_aq_reconcile_ingest_scheduler_url.sh": 3,
              ".github/workflows/uk_aq_cloudflare_scheduler_ingest_config_sync.yml": 2,
              ".github/workflows/uk_aq_cloudflare_scheduler_ingest_deploy.yml": 2,
          }
          for raw_path, expected in checks.items():
              text = Path(raw_path).read_text(encoding="utf-8")
              actual = text.count("npx --yes wrangler@4.121.0 ")
              if actual != expected:
                  raise SystemExit(f"{raw_path}: expected {expected} pinned npx calls, found {actual}")
              if "npx --yes wrangler@4 " in text:
                  raise SystemExit(f"{raw_path}: floating wrangler@4 remains")
          deploy = Path(".github/workflows/uk_aq_cloudflare_scheduler_ingest_deploy.yml").read_text(encoding="utf-8")
          if deploy.count('wranglerVersion: "4.121.0"') != 2:
              raise SystemExit("Expected both wrangler-action deploy steps to pin Wrangler 4.121.0")
          PY
          git diff --check

      - name: Verify pinned Wrangler and TEST D1 access
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] || [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Missing Cloudflare credentials required for targeted D1 validation."
            exit 1
          fi
          npx --yes wrangler@4.121.0 --version | tee /tmp/wrangler-version.txt
          grep -F "4.121.0" /tmp/wrangler-version.txt
          npx --yes wrangler@4.121.0 d1 execute uk_aq_cron_scheduler_ingest_db \
            --remote \
            --config cloudflare/scheduler/wrangler.toml \
            --json \
            --command "select 1 as ok" \
            > /tmp/d1-readonly-check.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/d1-readonly-check.json").read_text(encoding="utf-8"))
          rows = payload[0]["results"]
          if rows != [{"ok": 1}]:
              raise SystemExit(f"Unexpected D1 validation result: {rows!r}")
          print("Pinned Wrangler remote D1 read-only check passed.")
          PY

      - name: Commit correction and remove one-off workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/cloudflare/uk_aq_reconcile_ingest_scheduler_url.sh \
            .github/workflows/uk_aq_cloudflare_scheduler_ingest_config_sync.yml \
            .github/workflows/uk_aq_cloudflare_scheduler_ingest_deploy.yml
          git rm .github/workflows/oneoff_pin_wrangler_41210.yml
          git commit -m "Pin Wrangler for scheduler tooling"
          git push origin HEAD:main
