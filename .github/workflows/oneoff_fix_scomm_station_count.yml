name: One-off fix Sensor.Community station count

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oneoff_fix_scomm_station_count.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Sensor.Community station-count telemetry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("workers/uk_aq_sensorcommunity_cloud_run/index.mjs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "  return { updated: descriptiveRows.length, stationIds };",
                  "  return { seen: rows.length, updated: descriptiveRows.length, stationIds };",
              ),
              (
                  "    stations_updated: stationResult.updated,\n    timeseries_updated: timeseriesPayload.length,",
                  "    stations_updated: stationResult.seen,\n    station_metadata_updated: stationResult.updated,\n    timeseries_updated: timeseriesPayload.length,",
              ),
              (
                  "    interval_minutes: dueCheck.intervalMinutes,\n    observations_upserted: payload?.observations_upserted ?? null,",
                  "    interval_minutes: dueCheck.intervalMinutes,\n    stations_seen: payload?.stations_updated ?? null,\n    station_metadata_updated: payload?.station_metadata_updated ?? null,\n    observations_upserted: payload?.observations_upserted ?? null,",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match for replacement, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Structural checks
        run: |
          set -euo pipefail
          node --check workers/uk_aq_sensorcommunity_cloud_run/index.mjs
          git diff --check
          grep -F 'return { seen: rows.length, updated: descriptiveRows.length, stationIds };' workers/uk_aq_sensorcommunity_cloud_run/index.mjs
          grep -F 'stations_updated: stationResult.seen,' workers/uk_aq_sensorcommunity_cloud_run/index.mjs
          grep -F 'station_metadata_updated: stationResult.updated,' workers/uk_aq_sensorcommunity_cloud_run/index.mjs
          grep -F 'stations_seen: payload?.stations_updated ?? null,' workers/uk_aq_sensorcommunity_cloud_run/index.mjs

      - name: Commit correction and remove one-off workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/uk_aq_sensorcommunity_cloud_run/index.mjs
          git rm .github/workflows/oneoff_fix_scomm_station_count.yml
          git commit -m "Restore Sensor.Community station run count"
          git push origin HEAD:main
