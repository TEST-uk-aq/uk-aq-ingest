name: UK-AQ Raw Dropbox Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-dropbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests python-dotenv supabase

      - name: Capture raw payloads (Bristol)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          UK_AIR_RAW_DROPBOX_ALLOWED_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          UK_AIR_RAW_DROPBOX_FOLDER: /raw_data
        run: |
          python3 scripts/sos/sos_ingest.py \
            --discover \
            --refresh-recent \
            --hours 6 \
            --station-like Bristol \
            --all-pollutants \
            --raw-dropbox
