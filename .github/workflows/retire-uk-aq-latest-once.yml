name: Retire legacy uk_aq_latest once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-uk-aq-latest-once.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51
        with:
          version: latest

      - name: Delete deployed legacy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions delete uk_aq_latest \
            --project-ref zztjgmdiftqtdcrlfpvc \
            --yes
          if supabase functions list --project-ref zztjgmdiftqtdcrlfpvc | grep -Eq '(^|[[:space:]])uk_aq_latest([[:space:]]|$)'; then
            echo "uk_aq_latest is still deployed" >&2
            exit 1
          fi

      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/retire-uk-aq-latest-once.yml
          git commit -m "chore: remove one-time latest retirement workflow"
          git push
