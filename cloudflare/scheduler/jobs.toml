# Canonical job configuration for the ingest Cloudflare cron scheduler.
# Times in UTC

config_version = 1
scheduler_name = "uk-aq-cron-scheduler-ingest"

[jobs.uk_uk_aq_stations_daily]
enabled = true
cron_expr = "0 3 * * *"
target_type = "github_workflow"
github_repo = "TEST-uk-aq/uk-aq-ingest"
github_workflow_file = "uk_aq_stations_daily.yml"
github_ref = "main"
dry_run = false
notes = "UK-AQ Stations Daily Sync"

[jobs.uk_aq_blondon_communities]
enabled = true
cron_expr = "*/15 * * * *"
target_type = "cloud_run"
cloud_run_url_managed_by_deploy = true
cloud_run_method = "POST"
dry_run = false
notes = "Breathe London Communities ingest trigger"

[jobs.uk_aq_blondon_nodes]
enabled = true
cron_expr = "*/15 * * * *"
target_type = "cloud_run"
cloud_run_url_managed_by_deploy = true
cloud_run_method = "POST"
dry_run = false
notes = "Breathe London Nodes scheduled ingest trigger"

[jobs.uk_aq_openaq_safety]
enabled = true
cron_expr = "*/30 * * * *"
target_type = "cloud_run"
cloud_run_url_managed_by_deploy = true
cloud_run_method = "POST"
dry_run = true
notes = "OpenAQ safety trigger; service decides whether work is needed"

[jobs.uk_aq_openaq_safety.cloud_run_body]
trigger_mode = "safety"

[jobs.uk_aq_scomm]
enabled = true
cron_expr = "*/5 * * * *"
target_type = "cloud_run"
cloud_run_url_managed_by_deploy = true
cloud_run_method = "POST"
dry_run = false
notes = "Sensor.Community ingest trigger"

[jobs.uk_aq_sos]
enabled = true
cron_expr = "*/15 * * * *"
target_type = "cloud_run"
cloud_run_url_managed_by_deploy = true
cloud_run_method = "POST"
dry_run = true
notes = "UK-AIR SOS ingest trigger"

